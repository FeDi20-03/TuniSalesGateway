<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 jhiTranslate="zone.title">Zones & Affectations</h2>
    <button class="btn btn-primary" (click)="openCreateModal(zoneModal)">
      <fa-icon icon="plus"></fa-icon>
      <span jhiTranslate="zone.create">Nouvelle zone</span>
    </button>
  </div>

  <!-- Liste zones -->
  <div class="row mb-4">
    <div class="col-md-6">
      <h4 jhiTranslate="zone.zoneList">Zones</h4>
      <div *ngIf="isLoading" class="spinner-border" role="status"></div>
      <div *ngIf="!isLoading && zones.length === 0" class="alert alert-info" jhiTranslate="zone.noZones">Aucune zone définie.</div>
      <ul *ngIf="!isLoading && zones.length > 0" class="list-group">
        <li *ngFor="let z of zones" class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <strong>{{ z.name }}</strong>
            <small class="text-muted d-block">{{ z.description }}</small>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" (click)="openEditModal(zoneModal, z)" [attr.aria-label]="'Éditer ' + z.name">
              <fa-icon icon="pencil-alt"></fa-icon>
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteZone(z.id)" [attr.aria-label]="'Supprimer ' + z.name">
              <fa-icon icon="trash"></fa-icon>
            </button>
          </div>
        </li>
      </ul>
    </div>

    <!-- Carte placeholder -->
    <div class="col-md-6">
      <h4 jhiTranslate="zone.mapPlaceholder">Carte</h4>
      <div class="border rounded d-flex align-items-center justify-content-center bg-light" style="height: 300px">
        <div class="text-center text-muted">
          <fa-icon icon="map" size="3x"></fa-icon>
          <p class="mt-2" jhiTranslate="zone.mapComingSoon">Carte disponible prochainement (Leaflet)</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Affectations clients -->
  <div class="row">
    <div class="col-12">
      <h4 jhiTranslate="zone.assignments">Affectations clients</h4>
      <div class="row g-2 mb-3">
        <div class="col-md-4">
          <label class="form-label" for="selectCommercial" jhiTranslate="zone.selectCommercial">Sélectionner un commercial</label>
          <select id="selectCommercial" class="form-select" [(ngModel)]="selectedCommercial" (change)="loadClientsByCommercial()">
            <option value="" jhiTranslate="planVente.all">Tous</option>
            <option *ngFor="let c of commercials" [value]="c.login">{{ c.firstName }} {{ c.lastName }}</option>
          </select>
        </div>
      </div>

      <div *ngIf="clientAssignments.length === 0 && selectedCommercial" class="alert alert-info" jhiTranslate="zone.noClients">
        Aucun client affecté.
      </div>

      <div *ngIf="clientAssignments.length > 0" class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead class="table-secondary">
            <tr>
              <th scope="col" jhiTranslate="zone.clientName">Client</th>
              <th scope="col" jhiTranslate="zone.currentCommercial">Commercial actuel</th>
              <th scope="col" jhiTranslate="zone.reassign">Réaffecter</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let ca of clientAssignments">
              <td>{{ ca.clientName }}</td>
              <td>{{ ca.commercialLogin }}</td>
              <td>
                <div class="input-group input-group-sm">
                  <select class="form-select" #reassignSelect aria-label="Choisir commercial">
                    <option value="" jhiTranslate="zone.selectCommercial">-- Commercial --</option>
                    <option *ngFor="let c of commercials" [value]="c.login">{{ c.firstName }} {{ c.lastName }}</option>
                  </select>
                  <button
                    class="btn btn-primary btn-sm"
                    (click)="assignClient(ca.clientId, reassignSelect.value)"
                    jhiTranslate="zone.assign"
                  >
                    Assigner
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal zone -->
<ng-template #zoneModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="zone.form.title">Zone</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()" aria-label="Fermer"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="zoneForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="zName" jhiTranslate="zone.form.name">Nom</label>
        <input id="zName" type="text" class="form-control" formControlName="name" />
        <div
          *ngIf="zoneForm.get('name')?.invalid && zoneForm.get('name')?.touched"
          class="text-danger small"
          jhiTranslate="entity.validation.required"
        >
          Obligatoire.
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="zDesc" jhiTranslate="zone.form.description">Description</label>
        <textarea id="zDesc" class="form-control" formControlName="description" rows="3"></textarea>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">
      <span jhiTranslate="entity.action.cancel">Annuler</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="saveZone()" [disabled]="zoneForm.invalid || isSaving">
      <span jhiTranslate="entity.action.save">Sauvegarder</span>
    </button>
  </div>
</ng-template>
