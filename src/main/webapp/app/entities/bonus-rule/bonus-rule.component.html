<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 jhiTranslate="bonusRule.title">Règles de bonus</h2>
    <button class="btn btn-primary" (click)="openModal(ruleModal)">
      <fa-icon icon="plus"></fa-icon> <span jhiTranslate="bonusRule.create">Nouvelle règle</span>
    </button>
  </div>

  <div *ngIf="isLoading" class="d-flex justify-content-center my-4"><div class="spinner-border" role="status"></div></div>
  <div *ngIf="!isLoading && bonusRules.length === 0" class="alert alert-info" jhiTranslate="bonusRule.noRules">Aucune règle de bonus.</div>

  <div *ngIf="!isLoading && bonusRules.length > 0" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th scope="col" jhiTranslate="bonusRule.product">Produit</th>
          <th scope="col" jhiTranslate="bonusRule.zone">Zone</th>
          <th scope="col" jhiTranslate="bonusRule.period">Période</th>
          <th scope="col" jhiTranslate="bonusRule.amount">Montant</th>
          <th scope="col" jhiTranslate="entity.action.edit">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of bonusRules">
          <td>{{ r.productName }}</td>
          <td>{{ r.zoneName }}</td>
          <td>{{ r.periodStart | formatMediumDate }} → {{ r.periodEnd | formatMediumDate }}</td>
          <td>{{ r.amount | number: '1.2-2' }} DT</td>
          <td>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-outline-primary" (click)="openModal(ruleModal, r)" [attr.aria-label]="'Éditer règle'">
                <fa-icon icon="pencil-alt"></fa-icon>
              </button>
              <button class="btn btn-sm btn-danger" (click)="delete(r.id)" [attr.aria-label]="'Supprimer règle'">
                <fa-icon icon="trash"></fa-icon>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #ruleModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="bonusRule.form.title">Règle de bonus</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()" aria-label="Fermer"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="form" novalidate>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="bProduct" jhiTranslate="bonusRule.product">Produit</label>
          <input id="bProduct" type="text" class="form-control" formControlName="productName" list="productList" />
          <datalist id="productList">
            <option *ngFor="let p of products" [value]="p.name">{{ p.name }}</option>
          </datalist>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="bZone" jhiTranslate="bonusRule.zone">Zone</label>
          <select id="bZone" class="form-select" formControlName="zoneId">
            <option [value]="null" jhiTranslate="bonusRule.noZone">-- Toutes zones --</option>
            <option *ngFor="let z of zones" [value]="z.id">{{ z.name }}</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="bStart" jhiTranslate="bonusRule.periodStart">Début période</label>
          <input id="bStart" type="date" class="form-control" formControlName="periodStart" />
          <div
            *ngIf="form.get('periodStart')?.invalid && form.get('periodStart')?.touched"
            class="text-danger small"
            jhiTranslate="entity.validation.required"
          >
            Obligatoire.
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="bEnd" jhiTranslate="bonusRule.periodEnd">Fin période</label>
          <input id="bEnd" type="date" class="form-control" formControlName="periodEnd" />
          <div
            *ngIf="form.get('periodEnd')?.invalid && form.get('periodEnd')?.touched"
            class="text-danger small"
            jhiTranslate="entity.validation.required"
          >
            Obligatoire.
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="bAmount" jhiTranslate="bonusRule.amount">Montant (DT)</label>
        <input id="bAmount" type="number" class="form-control" formControlName="amount" min="0" />
        <div
          *ngIf="form.get('amount')?.invalid && form.get('amount')?.touched"
          class="text-danger small"
          jhiTranslate="entity.validation.required"
        >
          Obligatoire, >= 0.
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="bDesc" jhiTranslate="bonusRule.description">Description</label>
        <textarea id="bDesc" class="form-control" formControlName="description" rows="2"></textarea>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">
      <span jhiTranslate="entity.action.cancel">Annuler</span>
    </button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid || isSaving">
      <span jhiTranslate="entity.action.save">Sauvegarder</span>
    </button>
  </div>
</ng-template>
