<div class="login-container">
  <div class="login-card">
    <div class="logo-container">
      <jhi-logo variant="full" [size]="60" class="mb-3"></jhi-logo>
      <h2 data-cy="loginTitle" class="login-title">CONNEXION</h2>
      <p class="text-muted mb-0" jhiTranslate="login.title">Authentification</p>
    </div>

    <div
      class="alert alert-danger"
      *ngIf="authenticationError"
      role="alert"
      aria-live="polite"
      jhiTranslate="login.messages.error.authentication"
      data-cy="loginError"
    >
      <strong>Erreur d'authentification !</strong> Veuillez vérifier vos identifiants de connexion.
    </div>

    <form class="form" role="form" (ngSubmit)="login()" [formGroup]="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username" jhiTranslate="global.form.username.label">Email</label>
        <div class="input-group">
          <span class="input-group-text" aria-hidden="true"><i class="fa fa-envelope"></i></span>
          <input
            type="email"
            class="form-control"
            name="username"
            id="username"
            placeholder="example@domain.com"
            formControlName="username"
            autocomplete="email"
            aria-describedby="username-error"
            [attr.aria-invalid]="loginForm.get('username')!.invalid && loginForm.get('username')!.touched ? 'true' : null"
            #username
            data-cy="username"
            [ngClass]="{ 'is-invalid': loginForm.get('username')!.invalid && loginForm.get('username')!.touched }"
          />
        </div>
        <div
          *ngIf="loginForm.get('username')!.invalid && loginForm.get('username')!.touched"
          id="username-error"
          class="text-danger mt-1 small"
          aria-live="polite"
        >
          <div *ngIf="loginForm.get('username')!.errors?.['required']">L'email est requis.</div>
          <div *ngIf="loginForm.get('username')!.errors?.['email']">Veuillez saisir un email valide.</div>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password" jhiTranslate="login.form.password">Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text" aria-hidden="true"><i class="fa fa-lock"></i></span>
          <input
            type="password"
            class="form-control"
            name="password"
            id="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
            autocomplete="current-password"
            aria-describedby="password-error"
            [attr.aria-invalid]="loginForm.get('password')!.invalid && loginForm.get('password')!.touched ? 'true' : null"
            data-cy="password"
            [ngClass]="{ 'is-invalid': loginForm.get('password')!.invalid && loginForm.get('password')!.touched }"
          />
        </div>
        <div
          *ngIf="loginForm.get('password')!.invalid && loginForm.get('password')!.touched"
          id="password-error"
          class="text-danger mt-1 small"
          aria-live="polite"
        >
          <div *ngIf="loginForm.get('password')!.errors?.['required']">Le mot de passe est requis.</div>
          <div *ngIf="loginForm.get('password')!.errors?.['minlength']">Le mot de passe doit contenir au moins 4 caractères.</div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
          <label class="form-check-label text-muted" for="rememberMe" jhiTranslate="login.form.rememberme">
            Garder la session ouverte
          </label>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 mb-3"
        data-cy="submit"
        [disabled]="loginForm.invalid || isLoading"
        [attr.aria-busy]="isLoading ? 'true' : null"
        [attr.aria-label]="isLoading ? ('login.form.loading' | translate) : null"
      >
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span jhiTranslate="login.form.button">Connexion</span>
      </button>

      <div class="text-center mt-3">
        <a
          class="text-decoration-none"
          routerLink="/account/reset/request"
          data-cy="forgetYourPasswordSelector"
          jhiTranslate="login.password.forgot"
        >
          Avez-vous oublié votre mot de passe ?
        </a>
      </div>
    </form>
  </div>
</div>
